<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo — 文字排斥 + 涟漪背景</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #faf8f4;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      cursor: none;
    }

    /* ── 涟漪画布 ── */
    #ripple-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── 自定义光标 ── */
    .cursor-dot {
      position: fixed;
      width: 12px;
      height: 12px;
      background: rgba(196, 113, 11, 0.9);
      border-radius: 50%;
      pointer-events: none;
      z-index: 100;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, background 0.2s;
      mix-blend-mode: screen;
    }
    .cursor-dot.hovering {
      width: 40px;
      height: 40px;
      background: rgba(196, 113, 11, 0.3);
    }

    /* ── 主内容 ── */
    .hero {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2rem;
    }

    .hero-name {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(4rem, 2rem + 12vw, 12rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.03em;
      user-select: none;
      position: relative;
    }

    .hero-name .char {
      display: inline-block;
      transition: transform 0.1s ease-out;
      will-change: transform;
      position: relative;
    }

    /* 每个字符的弹性回弹 */
    .hero-name .char.returning {
      transition: transform 0.8s cubic-bezier(0.25, 1.5, 0.5, 1);
    }

    .hero-sub {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(0.8rem, 0.6rem + 1vw, 1.1rem);
      font-weight: 300;
      color: rgba(250, 248, 244, 0.4);
      letter-spacing: 0.15em;
      text-transform: lowercase;
      user-select: none;
    }

    .hero-sub .char {
      display: inline-block;
      transition: transform 0.1s ease-out, color 0.3s;
      will-change: transform;
    }
    .hero-sub .char.returning {
      transition: transform 0.8s cubic-bezier(0.25, 1.5, 0.5, 1), color 0.3s;
    }
    .hero-sub .char.active {
      color: rgba(196, 113, 11, 0.8);
    }

    /* ── 提示文字 ── */
    .hint {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.75rem;
      color: rgba(250, 248, 244, 0.2);
      letter-spacing: 0.1em;
      z-index: 10;
      animation: hint-fade 3s ease-in-out infinite alternate;
    }
    @keyframes hint-fade {
      0% { opacity: 0.2; }
      100% { opacity: 0.5; }
    }

    /* ── 粒子噪点 ── */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 99;
      pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 180px;
    }
  </style>
</head>
<body>
  <canvas id="ripple-canvas"></canvas>
  <div class="grain"></div>
  <div class="cursor-dot" id="cursor"></div>

  <div class="hero">
    <div class="hero-name" id="hero-name">何必</div>
    <div class="hero-sub" id="hero-sub">ai · code · creation</div>
  </div>

  <div class="hint">移动鼠标试试</div>

  <script>
    // ============================================================
    // 1. 文字拆分 — 每个字符包一个 span
    // ============================================================
    function splitText(el) {
      const text = el.textContent;
      el.textContent = '';
      const chars = [];
      for (const c of text) {
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = c === ' ' ? ' ' : c;
        el.appendChild(span);
        chars.push(span);
      }
      return chars;
    }

    const nameChars = splitText(document.getElementById('hero-name'));
    const subChars  = splitText(document.getElementById('hero-sub'));

    // ============================================================
    // 2. 自定义光标
    // ============================================================
    const cursor = document.getElementById('cursor');
    let mx = -100, my = -100;  // 鼠标位置
    let cx = -100, cy = -100;  // 光标位置（平滑跟随）

    document.addEventListener('mousemove', e => {
      mx = e.clientX;
      my = e.clientY;
    });

    function updateCursor() {
      cx += (mx - cx) * 0.15;
      cy += (my - cy) * 0.15;
      cursor.style.left = cx + 'px';
      cursor.style.top  = cy + 'px';
      requestAnimationFrame(updateCursor);
    }
    updateCursor();

    // ============================================================
    // 3. 文字排斥力场
    // ============================================================
    const REPULSE_RADIUS = 150;   // 排斥半径 px
    const REPULSE_STRENGTH = 80;  // 排斥力度 px

    function repulse(chars, strength) {
      for (const char of chars) {
        const rect = char.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top  + rect.height / 2;
        const dx = mx - cx;
        const dy = my - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < REPULSE_RADIUS && dist > 0) {
          // 在排斥范围内 — 推开
          const force = (1 - dist / REPULSE_RADIUS) * strength;
          const angle = Math.atan2(dy, dx);
          const tx = -Math.cos(angle) * force;
          const ty = -Math.sin(angle) * force;
          char.style.transform = `translate(${tx}px, ${ty}px)`;
          char.classList.remove('returning');
          char.classList.add('active');
        } else {
          // 弹回原位
          if (char.style.transform !== 'translate(0px, 0px)') {
            char.classList.add('returning');
            char.classList.remove('active');
            char.style.transform = 'translate(0px, 0px)';
          }
        }
      }
    }

    function animateText() {
      repulse(nameChars, REPULSE_STRENGTH);
      repulse(subChars, REPULSE_STRENGTH * 0.5);
      requestAnimationFrame(animateText);
    }
    animateText();

    // ============================================================
    // 4. 水面涟漪 Canvas
    // ============================================================
    const canvas = document.getElementById('ripple-canvas');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // 涟漪对象
    const ripples = [];

    class Ripple {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 0;
        this.maxRadius = 300 + Math.random() * 200;
        this.speed = 1.5 + Math.random() * 1;
        this.life = 1;
        this.lineWidth = 2;
      }
      update() {
        this.radius += this.speed;
        this.life = 1 - this.radius / this.maxRadius;
        return this.life > 0;
      }
      draw(ctx) {
        if (this.life <= 0) return;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(196, 113, 11, ${this.life * 0.15})`;
        ctx.lineWidth = this.lineWidth * this.life;
        ctx.stroke();

        // 第二层涟漪（稍慢，稍大）
        if (this.radius > 30) {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius * 0.7, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(196, 113, 11, ${this.life * 0.08})`;
          ctx.lineWidth = this.lineWidth * this.life * 0.6;
          ctx.stroke();
        }
      }
    }

    // 背景波纹 — 持续的微弱波纹
    const ambientRipples = [];
    let lastAmbient = 0;

    // 鼠标涟漪
    let lastRippleTime = 0;
    document.addEventListener('mousemove', e => {
      const now = Date.now();
      if (now - lastRippleTime > 80) {
        ripples.push(new Ripple(e.clientX, e.clientY));
        lastRippleTime = now;
      }
    });

    // 点击产生大涟漪
    document.addEventListener('click', e => {
      for (let i = 0; i < 3; i++) {
        const r = new Ripple(e.clientX, e.clientY);
        r.maxRadius = 400 + i * 150;
        r.speed = 2 + i * 0.5;
        r.lineWidth = 3 - i * 0.5;
        ripples.push(r);
      }
    });

    // 背景水面效果 — 缓慢移动的光斑
    const waves = [];
    for (let i = 0; i < 5; i++) {
      waves.push({
        x: Math.random() * 2000,
        y: Math.random() * 1200,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        size: 200 + Math.random() * 300,
        phase: Math.random() * Math.PI * 2
      });
    }

    let time = 0;

    function drawBackground() {
      // 深色基底
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, W, H);

      // 缓慢移动的光斑
      time += 0.005;
      for (const w of waves) {
        w.x += w.vx;
        w.y += w.vy;
        if (w.x < -w.size) w.x = W + w.size;
        if (w.x > W + w.size) w.x = -w.size;
        if (w.y < -w.size) w.y = H + w.size;
        if (w.y > H + w.size) w.y = -w.size;

        const pulse = 0.5 + 0.5 * Math.sin(time + w.phase);
        const gradient = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, w.size);
        gradient.addColorStop(0, `rgba(196, 113, 11, ${0.02 * pulse})`);
        gradient.addColorStop(0.5, `rgba(196, 113, 11, ${0.01 * pulse})`);
        gradient.addColorStop(1, 'rgba(196, 113, 11, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, W, H);
      }
    }

    function animate() {
      drawBackground();

      // 更新和绘制涟漪
      for (let i = ripples.length - 1; i >= 0; i--) {
        if (!ripples[i].update()) {
          ripples.splice(i, 1);
        } else {
          ripples[i].draw(ctx);
        }
      }

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
