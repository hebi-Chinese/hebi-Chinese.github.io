name: Firefox input diagnosis
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  compare:
    if: github.head_ref == 'codex/release-v1.4.2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm test -- tests/logo-diagnostic.spec.ts tests/logo-zoom.spec.ts --project=firefox --repeat-each=10 --workers=${{ matrix.workers }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-input-${{ matrix.workers }}
          path: .playwright/
          include-hidden-files: true
